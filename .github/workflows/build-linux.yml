name: Build Linux packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      features:
        description: "Cargo feature flags (e.g. --features sonar)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ubuntu-desktop:
    name: Ubuntu 24.04 desktop amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-Ctarget-cpu=x86-64"
    steps:
      - name: Require a disposable GitHub-hosted runner
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: test "$RUNNER_KIND" = github-hosted && test "$RUNNER_OS" = Linux
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install build and isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libpulse-dev unzip binutils apparmor desktop-file-utils xvfb xauth x11-utils dbus-x11 pipewire pipewire-pulse wireplumber pulseaudio-utils
      - name: Install locked JavaScript dependencies
        working-directory: desktop
        run: npm ci --include=dev
      - name: Unit and native safety gates
        run: |
          cargo test --locked --lib desktop::hardware::tests
          cargo test --locked --test nova7_gen2 --test desktop_hardware --test desktop_review --test desktop_lighting --test audit_core --test audit_hardware
          cargo clippy --all-targets --locked -- -D warnings
          cd desktop
          npm run typecheck
          npm test
          npm run test:packaging
      - name: Exercise real audio only on a private PipeWire-Pulse core
        env:
          SSGG_PACTL: /usr/bin/pactl
          SSGG_PACAT: /usr/bin/pacat
          SSGG_DESKTOP_BIN: target/debug/ssgg-desktop
        run: |
          # The test creates its own HOME, runtime, native/Pulse sockets, null sinks
          # and policy-only WirePlumber. Never run this against a desktop session.
          python3 - <<'PY'
          from pathlib import Path
          import re
          config = Path('/usr/share/wireplumber/wireplumber.conf').read_text()
          profile = re.search(r'(?m)^\s*policy\s*=\s*\{([^{}]*)\}', config)
          assert profile, 'WirePlumber policy profile missing'
          assert re.search(r'inherits\s*=\s*\[\s*base\s*\]', profile[1]), 'policy must inherit base only'
          assert 'policy.standard = required' in profile[1]
          assert not re.search(r'hardware\.|monitor\.', profile[1]), 'policy must not load hardware'
          PY
          cargo build --locked --bin ssgg-desktop
          python3 tests/desktop_isolated.py
      - name: Build real self-contained app and Debian archive
        working-directory: desktop
        run: |
          npm run package:deb -- --max-glibc 2.39
          tar -C release -cJf release/ssgg-gui-linux-amd64.tar.xz app
          cd release
          sha256sum ssgg-gui-linux-amd64.tar.xz > ssgg-gui-linux-amd64.tar.xz.sha256
      - name: Install the package on the disposable Ubuntu runner
        run: |
          sudo apt-get install -y ./desktop/release/ssgg-gui_*_amd64.deb
          test "$(stat -c '%U:%G:%a' /opt/ssgg/chrome-sandbox)" = root:root:4755
          desktop-file-validate /usr/share/applications/io.github.MrTheSoulz.SSGG.desktop
          ldd /opt/ssgg/ssgg-gui
          ldd /opt/ssgg/resources/ssgg-desktop
          test -x /usr/bin/pactl
          for package in "$PWD"/desktop/release/*.deb; do
            node desktop/scripts/verify-deb.mjs "$package" --runtime
          done
      - name: Exercise the installed launcher without sandbox exceptions
        working-directory: desktop
        run: |
          # test-session supplies a private bus, Xvfb and unreachable audio socket;
          # packaged-smoke verifies real Electron seccomp and forbids fixture writes.
          unset CHROME_DEVEL_SANDBOX ELECTRON_RUN_AS_NODE
          node scripts/test-session.mjs node tests/packaged-smoke.mjs /usr/bin/ssgg-gui artifacts/ubuntu-installed.json
      - name: Remove package without touching user state or legacy services
        run: |
          mkdir -p "$HOME/.config/ssgg-desktop"
          printf 'package-removal-sentinel\n' > "$HOME/.config/ssgg-desktop/keep-test"
          sudo apt-get purge -y ssgg-gui
          test -f "$HOME/.config/ssgg-desktop/keep-test"
          test ! -e /opt/ssgg/ssgg-gui
          test ! -e /usr/share/applications/io.github.MrTheSoulz.SSGG.desktop
          test ! -e /usr/lib/udev/rules.d/70-ssgg.rules
          test ! -e /etc/apparmor.d/io.github.MrTheSoulz.SSGG
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ssgg-ubuntu-24.04-amd64
          path: |
            desktop/release/*.deb
            desktop/release/*.sha256
            desktop/release/*.tar.xz
            desktop/artifacts/ubuntu-installed.json
          if-no-files-found: error
          retention-days: 30
  snap-experimental:
    name: Experimental strict Snap (build only)
    needs: ubuntu-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require a disposable GitHub-hosted runner
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: test "$RUNNER_KIND" = github-hosted && test "$RUNNER_OS" = Linux
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ssgg-ubuntu-24.04-amd64
          path: snap-input
      - name: Install Snap build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils squashfs-tools python3-yaml
      - name: Prepare the tested standalone application
        run: |
          (cd snap-input/release && sha256sum -c ssgg-gui-linux-amd64.tar.xz.sha256)
          test "$(sed -n 's/^StartupWMClass=//p' snap/gui/ssgg.desktop)" = io.github.MrTheSoulz.SSGG
          mkdir -p desktop/release
          tar -xJf snap-input/release/ssgg-gui-linux-amd64.tar.xz -C desktop/release
          node --test snap/tests/package-snap.test.mjs
          node desktop/scripts/package-snap.mjs --prepare-only
      - name: Build in the disposable matching-base runner
        working-directory: desktop/release/snap-project
        run: |
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode
      - name: Verify the real Snap payload without claiming installed usability
        working-directory: desktop/release/snap-project
        run: |
          shopt -s nullglob
          packages=(*.snap)
          test "${#packages[@]}" = 1
          package="${packages[0]}"
          unsquashfs -cat "$package" meta/snap.yaml > snap-metadata.yaml
          /usr/bin/python3 -c 'import yaml; m=yaml.safe_load(open("snap-metadata.yaml")); assert m["confinement"] == "strict" and m["base"] == "core24"'
          unsquashfs -cat "$package" app/ssgg-gui >/dev/null
          unsquashfs -cat "$package" app/resources/ssgg-desktop >/dev/null
          unsquashfs -cat "$package" usr/bin/pactl >/dev/null
          sha256sum "$package" > "$package.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ssgg-experimental-strict-snap-amd64
          path: |
            desktop/release/snap-project/*.snap
            desktop/release/snap-project/*.sha256
            desktop/release/snap-project/snap-metadata.yaml
          if-no-files-found: error
          retention-days: 30
  build-linux:
    if: github.event_name == 'workflow_dispatch'
    name: Build Linux / Arch x86_64
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git rust systemd

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create unprivileged build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build via PKGBUILD
        env:
          EXTRA_FEATURES: ${{ github.event.inputs.features }}
        run: |
          # Capture only the version token; the pkgver line carries a trailing
          # `# x-release-please-version` marker that makepkg ignores but a naive
          # parse would otherwise include.
          PKGVER=$(sed -n 's/^pkgver=\([^ ]*\).*/\1/p' PKGBUILD | head -n1)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive \
            --format=tar \
            --prefix="steelseriesgg-rs-${PKGVER}/" \
            --output="ssgg-${PKGVER}.tar" \
            HEAD
          gzip -n "ssgg-${PKGVER}.tar"
          su - builder -c "cd \"$GITHUB_WORKSPACE\" && SRCDEST=\"$GITHUB_WORKSPACE\" makepkg -sCf --noconfirm"

      - name: Package generic Linux binary
        run: tar -C src/target/release -czf ssgg-linux-x86_64.tar.gz ssgg

      - name: Compute checksums
        run: |
          sha256sum ssgg-linux-x86_64.tar.gz > sha256sums-linux.txt
          sha256sum *.pkg.tar.zst > sha256sums-arch.txt
          cat sha256sums-linux.txt
          cat sha256sums-arch.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssgg-linux-x86_64
          path: |
            ssgg-linux-x86_64.tar.gz
            sha256sums-linux.txt
            *.pkg.tar.zst
            sha256sums-arch.txt
          retention-days: 30
